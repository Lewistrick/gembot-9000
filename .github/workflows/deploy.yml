name: Deploy

# Runs on the self-hosted runner on the production box whenever main changes
# (including PR merges).
on:
  push:
    branches: [main]

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, gembot]
    steps:
      - name: Pull and rebuild
        working-directory: /home/weekmenu/apps/gembot-9000
        run: |
          git fetch origin main
          # Switch to main rather than resetting whatever branch is checked out;
          # this fails (and deploys nothing) if local changes would be overwritten.
          git checkout -B main origin/main
          docker compose up -d --build
          docker image prune -f
