services:
  gembot:
    build: .
    restart: unless-stopped
    # Localhost only: in production Caddy (~/apps/proxy) reaches this over the
    # shared `host-edge` network as `gembot:8000`.
    ports:
      - "127.0.0.1:8004:8000"
    networks:
      default: {}
      edge:
        aliases:
          - gembot
    environment:
      # Day boundary (rush hour, midnight rollover). Any IANA zone, e.g. Europe/Amsterdam.
      GEMBOT_TZ: UTC
    volumes:
      # Leaderboard, mined gems, players and rail survive restarts.
      - ./data:/app/data
    # Runs the image's stable CMD (no auto-reload). A restart drops every player's
    # socket; they reconnect on their own and resume where they were.
    #
    # For development with live code reload, add this to `volumes` above:
    #   - ./app:/app/app:ro
    # and uncomment the command below. Note: on Windows/macOS bind mounts, the
    # file watcher can fire spurious reloads, which will interrupt gameplay.
    # command: >
    #   uv run uvicorn app.server:app
    #   --host 0.0.0.0 --port 8000 --ws-max-size 65536 --reload

networks:
  # Created by the Caddy proxy stack (~/apps/proxy).
  edge:
    external: true
    name: host-edge
