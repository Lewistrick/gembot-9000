[project]
name = "gembot-9000"
version = "0.3.0"
description = "A shared daily mine for up to 100 mining robots"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.5.4",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
